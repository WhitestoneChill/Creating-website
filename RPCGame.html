<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora 霓虹猜拳對決</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            background-size: 200% 200%;
            animation: aurora 15s ease infinite;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: manipulation;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }
        .neon-glow-purple {
            box-shadow: 0 0 20px rgba(127, 0, 255, 0.4);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6), 0 0 20px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 selection:bg-cyan-500 selection:text-white">

    <!-- 頂部標題列 -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 bg-clip-text text-transparent neon-text">
            AURORA RPS
        </h1>
        <p class="text-xs text-cyan-200/60 mt-1 tracking-widest uppercase">Real-Time Multiplayer</p>
    </header>

    <!-- 主要內容容器 -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center my-2">

        <!-- 畫面 1：登入與房號選擇 -->
        <div id="screen-login" class="glass-card rounded-2xl p-6 flex flex-col gap-5">
            <div>
                <label class="block text-sm font-medium text-cyan-300 mb-2">你的暱稱</label>
                <input type="text" id="input-name" maxlength="10" placeholder="請輸入玩家名稱..." 
                    class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition">
            </div>

            <div class="grid grid-cols-2 gap-4 mt-2">
                <button onclick="createRoom()" 
                    class="py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-white neon-glow-cyan hover:opacity-90 active:scale-95 transition">
                    建立房間
                </button>
                <div class="flex flex-col gap-2">
                    <input type="text" id="input-room-id" maxlength="4" placeholder="4位房號" 
                        class="w-full text-center px-2 py-2 rounded-xl bg-slate-900/60 border border-slate-700 text-white placeholder-slate-500 tracking-widest font-mono focus:outline-none focus:border-purple-400">
                    <button onclick="joinRoom()" 
                        class="py-2 px-4 rounded-xl bg-gradient-to-r from-purple-500 to-pink-600 font-bold text-white neon-glow-purple hover:opacity-90 active:scale-95 transition text-sm">
                        加入房間
                    </button>
                </div>
            </div>
        </div>

        <!-- 畫面 2：遊戲大廳 / 等待室 -->
        <div id="screen-lobby" class="glass-card rounded-2xl p-6 hidden flex flex-col gap-5">
            <div class="flex justify-between items-center border-b border-white/10 pb-4">
                <div>
                    <span class="text-xs text-slate-400 block">房間代碼</span>
                    <span id="display-room-id" class="text-2xl font-mono font-bold text-cyan-400 tracking-wider">----</span>
                </div>
                <button onclick="leaveRoom()" class="text-xs px-3 py-1.5 rounded-lg bg-rose-500/20 border border-rose-500/40 text-rose-300 hover:bg-rose-500/30 transition">
                    離開房間
                </button>
            </div>

            <div>
                <h3 class="text-sm font-medium text-slate-300 mb-3">房間成員 (<span id="player-count">0</span>/2)</h3>
                <div id="players-list" class="space-y-2">
                    <!-- 動態載入玩家 -->
                </div>
            </div>

            <div id="host-controls" class="hidden mt-2">
                <button onclick="startGame()" 
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 font-bold text-white shadow-lg shadow-emerald-500/20 hover:opacity-90 active:scale-95 transition">
                    開始對決
                </button>
            </div>
            <div id="guest-waiting-text" class="text-center text-sm text-cyan-300/60 py-2 animate-pulse">
                等待房主開始遊戲...
            </div>
        </div>

        <!-- 畫面 3：猜拳進行中畫面 -->
        <div id="screen-game" class="glass-card rounded-2xl p-6 hidden flex flex-col gap-6">
            <!-- 比分板 -->
            <div class="flex justify-between items-center bg-black/20 p-3 rounded-xl border border-white/5">
                <div class="text-center flex-1">
                    <div id="p1-info" class="text-xs text-slate-400 truncate">玩家一</div>
                    <div id="p1-score" class="text-xl font-bold text-cyan-400 font-mono">0</div>
                </div>
                <div class="text-slate-500 font-bold px-2">VS</div>
                <div class="text-center flex-1">
                    <div id="p2-info" class="text-xs text-slate-400 truncate">玩家二</div>
                    <div id="p2-score" class="text-xl font-bold text-pink-400 font-mono">0</div>
                </div>
            </div>

            <!-- 狀態提示 -->
            <div class="text-center">
                <div id="game-status-text" class="text-lg font-bold text-cyan-200">請選擇你的出拳！</div>
                <div id="round-result-text" class="text-sm text-purple-300 mt-1 h-6 font-semibold"></div>
            </div>

            <!-- 出拳按鈕區 (手機好按大尺寸) -->
            <div id="choice-buttons" class="grid grid-cols-3 gap-3">
                <button id="btn-rock" onclick="makeChoice('rock')" class="choice-btn flex flex-col items-center justify-center py-5 rounded-2xl bg-slate-800/80 border border-slate-700 hover:border-cyan-400 active:scale-95 transition group">
                    <span class="text-3xl mb-1 group-hover:scale-110 transition">✊</span>
                    <span class="text-xs text-slate-300 font-medium">石頭</span>
                </button>
                <button id="btn-paper" onclick="makeChoice('paper')" class="choice-btn flex flex-col items-center justify-center py-5 rounded-2xl bg-slate-800/80 border border-slate-700 hover:border-cyan-400 active:scale-95 transition group">
                    <span class="text-3xl mb-1 group-hover:scale-110 transition">🖐️</span>
                    <span class="text-xs text-slate-300 font-medium">布</span>
                </button>
                <button id="btn-scissors" onclick="makeChoice('scissors')" class="choice-btn flex flex-col items-center justify-center py-5 rounded-2xl bg-slate-800/80 border border-slate-700 hover:border-cyan-400 active:scale-95 transition group">
                    <span class="text-3xl mb-1 group-hover:scale-110 transition">✌️</span>
                    <span class="text-xs text-slate-300 font-medium">剪刀</span>
                </button>
            </div>

            <!-- 結算後繼續按鈕 -->
            <div id="next-round-container" class="hidden flex flex-col gap-2">
                <button id="btn-next-round" onclick="resetRound()" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-500 to-indigo-600 font-bold text-white hover:opacity-90 active:scale-95 transition">
                    下一局
                </button>
                <p id="guest-next-wait" class="text-center text-xs text-slate-400 hidden animate-pulse">等待房主開啟下一局...</p>
            </div>
        </div>

    </main>

    <!-- 底部版權 -->
    <footer class="w-full max-w-md text-center py-2 text-xs text-slate-500">
        Aurora UI &bull; Firebase Realtime Sync
    </footer>

    <!-- Firebase SDK 引入與遊戲邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==================== 你的 Firebase 設定 ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBiQICWPS7pBZNypc6yUxT4JJsGIlxoBck",
            authDomain: "rps-4-3dace.firebaseapp.com",
            databaseURL: "https://rps-4-3dace-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rps-4-3dace",
            storageBucket: "rps-4-3dace.firebasestorage.app",
            messagingSenderId: "358850992705",
            appId: "1:358850992705:web:71778d15a8e5e4bfa504c0"
        };
        // ==============================================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentRoomId = null;
        let myPlayerId = 'p_' + Math.random().toString(36).substring(2, 9);
        let myName = '';
        let roomRef = null;
        let roomDataListener = null;

        function switchScreen(screenId) {
            ['screen-login', 'screen-lobby', 'screen-game'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function generateRoomId() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function setChoiceButtonsEnabled(enabled) {
            const btns = document.querySelectorAll('.choice-btn');
            btns.forEach(b => {
                if (enabled) {
                    b.classList.remove('opacity-50', 'pointer-events-none');
                } else {
                    b.classList.add('opacity-50', 'pointer-events-none');
                }
            });
        }

        // 建立房間
        window.createRoom = async function() {
            const nameInput = document.getElementById('input-name').value.trim();
            if (!nameInput) {
                alert('請先輸入你的暱稱！');
                return;
            }
            myName = nameInput;
            currentRoomId = generateRoomId();

            roomRef = ref(db, 'rooms/' + currentRoomId);
            const snapshot = await get(roomRef);
            
            if (snapshot.exists()) {
                currentRoomId = generateRoomId();
                roomRef = ref(db, 'rooms/' + currentRoomId);
            }

            const initialData = {
                host: myPlayerId,
                status: 'waiting',
                roundState: 'selecting',
                lastResultText: '',
                players: {
                    [myPlayerId]: {
                        name: myName,
                        choice: '',
                        score: 0
                    }
                }
            };

            await set(roomRef, initialData);
            initRoomListener();
            enterLobbyUI(true);
        };

        // 加入房間
        window.joinRoom = async function() {
            const nameInput = document.getElementById('input-name').value.trim();
            const roomIdInput = document.getElementById('input-room-id').value.trim();

            if (!nameInput) {
                alert('請先輸入你的暱稱！');
                return;
            }
            if (!roomIdInput || roomIdInput.length !== 4) {
                alert('請輸入正確的 4 位數房號！');
                return;
            }

            currentRoomId = roomIdInput;
            roomRef = ref(db, 'rooms/' + currentRoomId);
            const snapshot = await get(roomRef);

            if (!snapshot.exists()) {
                alert('找不到此房間，請確認房號是否正確！');
                return;
            }

            const data = snapshot.val();
            const players = data.players || {};
            const playerKeys = Object.keys(players);

            if (data.status !== 'waiting') {
                alert('遊戲已經開始或結束，無法加入！');
                return;
            }

            if (playerKeys.length >= 2) {
                alert('房間人數已滿 (最多 2 人)！');
                return;
            }

            myName = nameInput;
            await update(ref(db, `rooms/${currentRoomId}/players/${myPlayerId}`), {
                name: myName,
                choice: '',
                score: 0
            });

            initRoomListener();
            enterLobbyUI(false);
        };

        function enterLobbyUI(isHost) {
            document.getElementById('display-room-id').innerText = currentRoomId;
            if (isHost) {
                document.getElementById('host-controls').classList.remove('hidden');
                document.getElementById('guest-waiting-text').classList.add('hidden');
            } else {
                document.getElementById('host-controls').classList.add('hidden');
                document.getElementById('guest-waiting-text').classList.remove('hidden');
            }
            switchScreen('screen-lobby');
        }

        function initRoomListener() {
            if (roomDataListener) roomDataListener();

            roomDataListener = onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const players = data.players || {};
                const playerKeys = Object.keys(players);
                document.getElementById('player-count').innerText = playerKeys.length;

                let listHtml = '';
                playerKeys.forEach(pId => {
                    const p = players[pId];
                    const isMe = pId === myPlayerId;
                    const isHostTag = pId === data.host ? '<span class="text-xs bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded ml-2">房主</span>' : '';
                    listHtml += `
                        <div class="flex justify-between items-center p-3 rounded-xl bg-white/5 border border-white/5">
                            <span class="font-medium text-white">${p.name} ${isMe ? '(你)' : ''} ${isHostTag}</span>
                            <span class="text-xs text-slate-400 font-mono">分數: ${p.score || 0}</span>
                        </div>
                    `;
                });
                document.getElementById('players-list').innerHTML = listHtml;

                if (data.status === 'playing' || data.status === 'finished') {
                    if (document.getElementById('screen-game').classList.contains('hidden')) {
                        switchScreen('screen-game');
                    }
                    updateGameUI(data);
                } else if (data.status === 'waiting') {
                    if (!document.getElementById('screen-game').classList.contains('hidden')) {
                        switchScreen('screen-lobby');
                    }
                }
            });
        }

        window.startGame = async function() {
            await update(roomRef, { 
                status: 'playing',
                roundState: 'selecting',
                lastResultText: ''
            });
        };

        window.makeChoice = async function(choice) {
            await update(ref(db, `rooms/${currentRoomId}/players/${myPlayerId}`), {
                choice: choice
            });
            setChoiceButtonsEnabled(false);
            document.getElementById('game-status-text').innerText = '已出拳，等待其他人中...';
        };

        function updateGameUI(data) {
            const players = data.players || {};
            const playerKeys = Object.keys(players);

            const myData = players[myPlayerId] || {};
            const opponentKeys = playerKeys.filter(k => k !== myPlayerId);
            const opponentKey = opponentKeys[0];
            const opponentData = opponentKey ? players[opponentKey] : { name: '等待對手...', score: 0, choice: '' };

            document.getElementById('p1-info').innerText = myData.name + ' (你)';
            document.getElementById('p1-score').innerText = myData.score || 0;
            document.getElementById('p2-info').innerText = opponentData.name;
            document.getElementById('p2-score').innerText = opponentData.score || 0;

            const isHost = (myPlayerId === data.host);

            // 檢查雙方是否都已選擇
            let allChosen = playerKeys.length >= 2;
            playerKeys.forEach(k => {
                if (!players[k].choice || players[k].choice === '') {
                    allChosen = false;
                }
            });

            // 如果雙方都選擇了，但尚未進行該回合的結算 calculation
            if (allChosen && data.roundState === 'selecting') {
                if (isHost) {
                    evaluateWinner(players, playerKeys);
                }
                return;
            }

            // 如果回合已經完成結算 (roundState === 'evaluated')
            if (data.roundState === 'evaluated') {
                setChoiceButtonsEnabled(false);
                document.getElementById('game-status-text').innerText = '本局結果揭曉！';
                document.getElementById('round-result-text').innerText = data.lastResultText || '';

                document.getElementById('next-round-container').classList.remove('hidden');
                if (isHost) {
                    document.getElementById('btn-next-round').classList.remove('hidden');
                    document.getElementById('guest-next-wait').classList.add('hidden');
                } else {
                    document.getElementById('btn-next-round').classList.add('hidden');
                    document.getElementById('guest-next-wait').classList.remove('hidden');
                }
            } else {
                // 還在進行選擇階段 (roundState === 'selecting')
                document.getElementById('next-round-container').classList.add('hidden');
                document.getElementById('round-result-text').innerText = '';

                if (myData.choice) {
                    setChoiceButtonsEnabled(false);
                    document.getElementById('game-status-text').innerText = '已出拳，等待對手出拳...';
                } else {
                    setChoiceButtonsEnabled(true);
                    document.getElementById('game-status-text').innerText = '請選擇你的出拳！';
                }
            }
        }

        async function evaluateWinner(players, keys) {
            if (keys.length < 2) return;
            const p1Key = keys[0];
            const p2Key = keys[1];
            const c1 = players[p1Key].choice;
            const c2 = players[p2Key].choice;

            let resultText = '';
            let newScores = {
                [p1Key]: players[p1Key].score || 0,
                [p2Key]: players[p2Key].score || 0
            };

            if (c1 === c2) {
                resultText = `🤝 平手！ (${players[p1Key].name}: ${translateChoice(c1)} vs ${players[p2Key].name}: ${translateChoice(c2)})`;
            } else if (
                (c1 === 'rock' && c2 === 'scissors') ||
                (c1 === 'paper' && c2 === 'rock') ||
                (c1 === 'scissors' && c2 === 'paper')
            ) {
                resultText = `🎉 ${players[p1Key].name} 贏了！ (${translateChoice(c1)} 勝 ${translateChoice(c2)})`;
                newScores[p1Key] += 1;
            } else {
                resultText = `🎉 ${players[p2Key].name} 贏了！ (${translateChoice(c2)} 勝 ${translateChoice(c1)})`;
                newScores[p2Key] += 1;
            }

            const updates = {
                [`players/${p1Key}/score`]: newScores[p1Key],
                [`players/${p2Key}/score`]: newScores[p2Key],
                roundState: 'evaluated',
                lastResultText: resultText
            };

            await update(roomRef, updates);
        }

        function translateChoice(c) {
            if (c === 'rock') return '石頭 ✊';
            if (c === 'paper') return '布 🖐️';
            if (c === 'scissors') return '剪刀 ✌️';
            return '未出';
        }

        window.resetRound = async function() {
            const snapshot = await get(roomRef);
            if (!snapshot.exists()) return;
            const players = snapshot.val().players || {};
            
            let updates = {
                roundState: 'selecting',
                lastResultText: ''
            };

            Object.keys(players).forEach(k => {
                updates[`players/${k}/choice`] = '';
            });

            await update(roomRef, updates);
        };

        window.leaveRoom = async function() {
            if (roomRef && currentRoomId) {
                await remove(ref(db, `rooms/${currentRoomId}/players/${myPlayerId}`));
            }
            if (roomDataListener) roomDataListener();
            currentRoomId = null;
            switchScreen('screen-login');
        };
    </script>
</body>
</html>
