name: Update Google News

on:
  schedule:
    # 台灣時間每週一早上 8 點 (UTC 0 點)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install feedparser
        run: pip install feedparser

      - name: Fetch RSS and generate JSON
        env:
          RSS_URL: 'https://www.google.com/alerts/feeds/00437155220071003950/7744391687657049501'
        run: |
          python -c '
          import os, json, feedparser
          url = os.environ["RSS_URL"]
          feed = feedparser.parse(url)
          news = []
          for entry in feed.entries[:10]:
              news.append({
                  "title": entry.get("title", ""),
                  "link": entry.get("link", ""),
                  "published": entry.get("published", "")
              })
          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(news, f, ensure_ascii=False, indent=2)
          '

      - name: Commit and push if news changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: update news.json automatically" && git push)
